<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TrustCart · Shop</title>
<style>
:root{--bg:#f3f6fb;--pn:#fff;--bd:#e5ebf5;--tx:#0f1f3d;--mu:#6b7a99;--bl:#1f6bff;--gr:#16a34a;--am:#f59e0b;--nav:#0b1d46}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:#dfe8ff;padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 18px;border-bottom:1px solid #ffffff22;margin-bottom:14px}.brand b{font-size:22px;color:#fff;display:block}.brand small{color:#9fb2dd}
.nv{display:flex;flex-direction:column;gap:6px;flex:1}.nv button{display:flex;gap:12px;align-items:center;background:none;border:0;color:#dfe8ff;padding:12px;border-radius:10px;text-align:left}
.nv button.on{background:var(--bl);color:#fff}.nv i{font-style:normal;width:22px;text-align:center}.bd{margin-left:auto;background:var(--bl);color:#fff;border-radius:10px;padding:0 8px;font-size:12px}.nv .on .bd{background:#ffffff33}
.st{border-top:1px solid #ffffff22;padding-top:12px;font-size:13px;color:#9fb2dd}.st b{color:#35d07f;display:block;margin-bottom:2px}
main{padding:20px 24px 28px;min-width:0}.hd{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}.av{width:46px;height:46px;border-radius:50%;background:#dfe8fb;display:grid;place-items:center;font-size:22px}
.hd h1{margin:0;font-size:24px}.hd p{margin:0;color:var(--mu)}.sp{flex:1}.chip{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:9px 14px}.ck{text-align:right}.ck b{font-size:20px;display:block}.ck span{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:1.15fr 1fr .8fr;gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0a1f4410}.card h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.sc{display:flex;gap:14px;align-items:center;border-radius:14px;padding:16px;border:1px solid #bfe9d2;background:#ecfbf3}.sc.w{background:#fff7e6;border-color:#f6d9a3}.sc .ic{width:54px;height:54px;border-radius:50%;background:var(--gr);color:#fff;display:grid;place-items:center;font-size:28px;flex:none}.sc.w .ic{background:var(--am)}
.sc b{font-size:18px;color:#0f7a3d;display:block}.sc.w b{color:#9a5b00}.sc span{color:var(--mu)}.sc button{margin:8px 8px 0 0}
.pill{background:#e8f0ff;color:var(--bl);border-radius:12px;padding:2px 10px;font-size:13px}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.it img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#f2f5fa}.it div{flex:1}.it small{color:var(--mu);display:block}.it b{font-size:16px}
.tot{display:flex;justify-content:space-between;background:#eef3fc;border-radius:10px;padding:14px;margin:12px 0;font-size:18px}.tot b{font-size:22px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bt{border-radius:10px;padding:13px;font-weight:600;border:1px solid var(--bl);background:#fff;color:var(--bl)}.bt.p{background:var(--bl);color:#fff}.bt:disabled{opacity:.55}
.lv{position:relative;border-radius:12px;overflow:hidden;line-height:0;background:#000}.lv img,.lv video{width:100%;max-height:300px;object-fit:cover}.tag{position:absolute;left:14px;bottom:16px;background:#16a34add;color:#fff;border-radius:8px;padding:8px 12px;line-height:1.2;font-weight:600}
.ac{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.ac img{width:40px;height:40px;border-radius:8px}.ac span{flex:1}.ac small{color:var(--mu)}.ok{color:var(--gr)}
.qa{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;width:100%;text-align:left}.qa i{font-style:normal;width:42px;height:42px;border-radius:50%;background:#eef3fc;display:grid;place-items:center;font-size:20px}.qa small{color:var(--mu);display:block}
.safe{background:#e8f0ff;border-radius:14px;padding:16px;display:flex;gap:12px}.safe b{display:block;color:#143a8c}.safe small{color:var(--mu)}
.lk{background:none;border:0;color:var(--bl);padding:6px 0}.mu{color:var(--mu)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.map button{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:14px;text-align:left}.map button.on{border-color:var(--bl);background:#eef3fc}.map small{color:var(--mu);display:block}
.md{position:fixed;inset:0;background:#0a1f4488;display:none;place-items:center;z-index:50;padding:12px}.md.on{display:grid}.mb{background:#fff;border-radius:16px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto}
input,select{border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:#fff;color:var(--tx)}.rs{background:#eef3fc;border-radius:10px;padding:12px;margin:10px 0}
#ts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#0b1d46;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90vw}
@media(max-width:1199px){.g{grid-template-columns:1fr 1fr}.col:nth-child(3){grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.col:nth-child(3)>*{flex:1 1 280px}}
@media(max-width:899px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));z-index:40}
 .brand,.st{display:none}.nv{flex-direction:row;justify-content:space-around}.nv button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;text-align:center}.bd{position:absolute;margin:-4px 0 0 22px}main{padding:14px 12px 96px}.g{grid-template-columns:minmax(0,1fr)}.hd h1{font-size:20px}.ck{display:none}}
</style></head><body><div class="app">
<aside class="side"><div class="brand"><span style="font-size:34px">🛒</span><div><b>TrustCart</b><small>Scan · Shop · Safe</small></div></div><nav class="nv" id="nv"></nav>
<div class="st"><b id="on">● Online</b><span id="of">Offline mode available</span></div></aside>
<main><div class="hd"><div class="av">👤</div><div><h1 id="hi">Hello!</h1><p id="tg"></p></div><div class="sp"></div><div class="chip" id="sn">🏬 Store</div><div class="ck"><b id="clk"></b><span id="dt"></span></div></div><div id="mn"></div></main></div>
<div class="md" id="md"><div class="mb" id="mb"></div></div><div id="ts"></div>

const basketHTML=()=>{const ks=Object.keys(CART).filter(k=>CART[k]>0);return `<h3><span>🧺 ${t('basket')}</span><span class="pill">${count()} ${t('items')}</span></h3>${ks.map(k=>{const p=P(k);return `<div class="it"><img src="${TH[k]||''}" alt=""><div><b>${E(p.name)}</b><small>${E(p.unit)}${CART[k]>1?' × '+CART[k]:''}</small></div><b>₹ ${p.price*CART[k]}</b></div>`}).join('')||`<p class="mu">${t('empty')}</p>`}<div class="tot"><span>${t('total')}</span><b>₹ ${sum()}</b></div><div class="r2"><button class="bt" data-a="scan">▣ ${t('scan')}</button><button class="bt p" id="co" ${count()?'':'disabled'}>🛍 ${t('checkout')}</button></div><p class="mu" id="cm" style="margin:8px 0 0"></p>`};
const statusHTML=()=>nudge?`<div class="sc w"><div class="ic">!</div><div><b>${E(t('forgot',{n:nudge.name}))}</b><span>${E(t('took',{q:nudge.qty}))}</span><br><button class="bt p" data-n="added">${t('add')}</button><button class="bt" data-n="putback">${t('put')}</button><button class="bt" data-n="dispute">${t('dis')}</button></div></div>`:`<div class="sc"><div class="ic">✓</div><div><b>${t('all')}</b><span>${t('nomis')}</span></div></div>`;
const actHTML=()=>`<h3><span>🕑 ${t('recent')}</span></h3>${ACT.map(a=>{const d=new Date(a.ts*1e3);return `<div class="ac"><img src="${TH[a.sku]||''}" alt=""><span>${E(P(a.sku).name)} ✓${a.qty>1?' ×'+a.qty:''}</span><small>${pad(d.getHours())}:${pad(d.getMinutes())}</small></div>`}).join('')||'<p class="mu">—</p>'}`;
function render(){nav();const m=$('#mn');
 if(view=='home')m.innerHTML=`<div class="g"><div class="col"><div id="sc">${statusHTML()}</div><div class="card" id="bk">${basketHTML()}</div></div><div class="col"><div class="card"><h3><span>▦ Live Scan View</span><span class="ok" style="font-size:13px">● Live</span></h3><div class="lv"><img id="im" src="${LIVE}" alt="Scan view"><video id="vd" playsinline muted hidden></video><div class="tag" id="tag" hidden></div></div><button class="lk" id="cam">📷 Camera</button></div><div class="card" id="ac">${actHTML()}</div></div>
  <div class="col"><div class="card"><h3><span>⚡ ${t('quick')}</span></h3><button class="qa" data-a="scan"><i>▣</i><span>${t('scan')}<small>Scan item or recognise by photo</small></span></button><button class="qa" data-v="basket"><i>🧺</i><span>${t('basket')}<small>Check your items</small></span></button><button class="qa" data-v="map"><i>📍</i><span>${t('map')}<small>Find products easily</small></span></button><button class="qa" data-v="settings"><i>⚙</i><span>${t('settings')}<small>App preferences</small></span></button></div><div class="safe"><span style="font-size:36px">🛡</span><div><b>Your shopping is safe with TrustCart</b><small>AI-powered scan &amp; go loss prevention</small></div></div></div></div>`;
 else if(view=='basket')m.innerHTML=`<div id="sc">${statusHTML()}</div><div class="card" id="bk" style="margin-top:16px">${basketHTML()}</div>`;
 else if(view=='map'){const by={};CAT.forEach(p=>(by[p.shelf[0]]=by[p.shelf[0]]||[]).push(p));m.innerHTML=Object.keys(by).sort().map(a=>`<div class="card" style="margin-bottom:14px"><h3>Aisle ${a}</h3><div class="map">${by[a].map(p=>`<button data-z="${p.shelf}" class="${zone==p.shelf?'on':''}"><b>${p.shelf}</b> · ${E(p.name)}<small>${zone==p.shelf?'You are here':'Tap when you arrive'}</small></button>`).join('')}</div></div>`).join('')+'<p class="mu">Checking in at a shelf (or scanning its QR code) lets TrustCart send any reminder to you, not another shopper.</p>'}
 else m.innerHTML=`<div class="card"><h3>${t('settings')}</h3><p><b>${t('lang')}</b><br><select id="lg"><option value="en">English</option><option value="hi"${lang=='hi'?' selected':''}>हिन्दी</option><option value="mr"${lang=='mr'?' selected':''}>मराठी</option></select></p><p><b>Family cart</b><br><span class="mu">Share this code so family can add to the same basket:</span> <b>${E(SID)}</b><br><input id="jc" placeholder="Enter a code" maxlength="12"> <button class="bt" id="jb">Join</button></p><p><button class="bt" id="lo">${t('signout')}</button></p></div>`}
async function loadAll(){try{const [c,a]=await Promise.all([api('/api/cart/'+SID),api('/api/activity/'+SID)]);CART={};c.forEach(x=>CART[x.sku]=x.qty);Q.forEach(q=>CART[q.sku]=(CART[q.sku]||0)+q.qty);ACT=a}catch(e){}refresh()}
function refresh(){nav();const s=$('#sc'),b=$('#bk'),a=$('#ac');if(s)s.innerHTML=statusHTML();if(b)b.innerHTML=basketHTML();if(a)a.innerHTML=actHTML()}
async function flush(){while(Q.length){try{await api('/api/scan',{m:'POST',b:{sku:Q[0].sku,qty:Q[0].qty,session:SID}});Q.shift()}catch(e){if(e.status==403){Q.shift();continue}break}}loadAll()}
function add(k,n=1){Q.push({sku:k,qty:n});CART[k]=(CART[k]||0)+n;const g=$('#tag');if(g){g.hidden=false;g.innerHTML=E(P(k).name)+'<br>Scanned ✓';clearTimeout(tagT);tagT=setTimeout(()=>g.hidden=true,4000)}toast(P(k).name+' added');refresh();flush()}
const reg=()=>api('/api/session',{m:'POST',b:{session:SID,zone}}).catch(()=>{});
function connect(){if(es)es.close();reg();es=new EventSource('/api/shopper/stream?session='+SID);es.onmessage=m=>{const d=JSON.parse(m.data);if(d.k=='nudge'){nudge=d;refresh();if(navigator.vibrate)navigator.vibrate(150)}}}
const M=h=>{$('#mb').innerHTML=h;$('#md').classList.add('on')},closeM=()=>$('#md').classList.remove('on');
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,320/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.src=x.result};x.readAsDataURL(f)});
function scanModal(){M(`<h3 style="margin:0 0 10px">${t('scan')}</h3><p class="mu" style="margin:0 0 8px">Recognise by photo</p><input type="file" id="ph" accept="image/*" capture="environment"> ${stream?'<button class="bt" id="snap">Use live camera frame</button>':''}<div id="rr"></div><p class="mu" style="margin:14px 0 8px">Or pick the product</p><div class="map">${CAT.map(p=>`<button data-p="${p.sku}"><img src="${TH[p.sku]||''}" width="34" alt=""> ${E(p.name)}<small>₹ ${p.price}</small></button>`).join('')}</div>${'BarcodeDetector' in window?'<p><button class="bt" id="bc">▣ Scan barcode</button></p>':''}`)}
async function recog(img){$('#rr').innerHTML='<div class="rs">Looking…</div>';try{const r=await api('/api/recognize',{m:'POST',b:{image:img}}),top=r.top[0];
 $('#rr').innerHTML=r.confident?`<div class="rs"><b>Looks like ${E(r.name)}</b> (${Math.round(top.prob*100)}% sure)<br><button class="bt p" data-p="${top.sku}">Add to basket</button></div>`:`<div class="rs">Not sure. Best guess: <b>${E(r.name)}</b> (${Math.round(top.prob*100)}%). Please pick the product below.</div>`}catch(e){$('#rr').innerHTML=`<div class="rs">${E(e.message)}</div>`}}
async function camera(){const v=$('#vd'),i=$('#im');if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;v.hidden=true;i.hidden=false;$('#cam').textContent='📷 Camera';return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.hidden=false;i.hidden=true;v.play();$('#cam').textContent='Stop camera'}catch(e){toast('Camera unavailable. Allow access (needs https).')}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-v],[data-a],[data-n],[data-z],[data-p],#co,#cam,#jb,#lo,#snap,#bc,#md');if(!b)return;const d=b.dataset;
 try{if(b.id=='md'){if(e.target.id=='md')closeM()}else if(d.v){view=d.v;render()}else if(d.a=='scan'||d.v=='scan'){scanModal()}
 else if(d.n){const x=nudge;nudge=null;refresh();await api('/api/alerts/'+x.id+'/respond',{m:'POST',b:{action:d.n,session:SID,note:d.n=='dispute'?(prompt('What happened? (optional)')||''):undefined}});loadAll()}
 else if(d.z){zone=d.z;await reg();render();toast('Checked in at '+zone)}else if(d.p){closeM();add(d.p)}
 else if(b.id=='co'){try{const r=await api('/api/checkout',{m:'POST',b:{session:SID}});$('#cm').innerHTML=`✓ Verified. Pay ₹${r.total}: <a href="${E(r.upi)}">Open UPI app</a>`}catch(x){$('#cm').textContent=x.message}}
 else if(b.id=='cam')camera();else if(b.id=='snap'){const v=$('#vd'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);recog(c.toDataURL('image/jpeg',.8))}
 else if(b.id=='jb'){await api('/api/trip/join',{m:'POST',b:{session:$('#jc').value.trim().toUpperCase()}});SID=$('#jc').value.trim().toUpperCase();connect();loadAll();toast('Joined the cart')}
 else if(b.id=='lo'){await api('/api/logout',{m:'POST'});location='/login'}
 else if(b.id=='bc'){const bd=new BarcodeDetector(),v=document.createElement('video');v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});await v.play();const iv=setInterval(async()=>{const c=await bd.detect(v);if(c[0]){clearInterval(iv);v.srcObject.getTracks().forEach(x=>x.stop());toast('Barcode '+c[0].rawValue+' read. Map it to a product in BARCODES to auto-add.')}},300)}}catch(err){if(err.message!='auth'&&err.message)toast(err.message)}});
document.addEventListener('change',async e=>{if(e.target.id=='ph'&&e.target.files[0])recog(await rd(e.target.files[0]));if(e.target.id=='lg'){lang=e.target.value;render()}});
setInterval(()=>{const d=new Date();$('#clk').textContent=pad(d.getHours())+':'+pad(d.getMinutes());$('#dt').textContent=d.toDateString().slice(4)},1000);
addEventListener('online',flush);addEventListener('offline',nav);setInterval(flush,5000);setInterval(reg,20000);
(async()=>{try{ME=await api('/api/me');if(ME.role!='customer'){location='/';return}CAT=await api('/api/catalog');SID=(await api('/api/trip',{m:'POST'})).session;connect();render();await loadAll()}catch(e){}})();
</script></body></html>
